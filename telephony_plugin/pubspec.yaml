name: telephony_plugin
description: A Flutter plugin for telephony functions
version: 0.0.1
homepage: your_homepage

environment:
  sdk: '>=2.12.0 <3.0.0'
  flutter: '>=1.20.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.example.telephony_plugin
        pluginClass: TelephonyPlugin